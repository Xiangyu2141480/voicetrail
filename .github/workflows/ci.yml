name: Engineering checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install external media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.13.6
          uv sync --locked
          npm ci --prefix frontend
      - name: Offline engineering, contract and frontend checks
        run: .venv/bin/python -m scripts.verify --report /tmp/engineering-results.json
      - name: Scan all reachable history
        run: .venv/bin/python -m scripts.audit_history
      # No audio/weights are distributed to CI. Green engineering checks do not
      # replace the mandatory local --real gate recorded in docs/verify_results.json.
